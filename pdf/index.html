<!doctype html>
<html lang="vi" data-root="../">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SV5T | PDF</title>
  <meta name="description" content="Bộ công cụ PDF SV5T: gộp, tách, nén, chuyển HEIC/JPG/PNG/WEBP ↔ PDF và các dịch vụ kiểu iLovePDF, chạy trên trình duyệt." />
  <meta name="theme-color" content="#f4f4f5" />
  <link rel="icon" href="../assets/logo-sv5t.png" />
  <link rel="stylesheet" href="../style.css?v=15" />
</head>
<body>
  <script src="../vendor/icons.js"></script>

  <div class="bg page-pdf" aria-hidden="true"><div class="bg-grid"></div><div class="deco-stripe"></div><div class="deco-blob"></div></div>

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="../">
        <img class="brand-logo" src="../assets/logo-sv5t.png" alt="Sinh viên 5 tốt" />
        <span class="brand-name">SV5T<span>PDF</span></span>
      </a>
      <nav class="top-actions" aria-label="Chuyển trang">
        <a class="top-btn active" href="./"><svg class="i"><use href="#i-file-text" /></svg> PDF</a>
        <a class="top-btn" href="../img/"><svg class="i"><use href="#i-file-image" /></svg> Ảnh</a>
      </nav>
      <div class="partners">
        <img src="../assets/logo-Doan.png" alt="Đoàn Thanh niên Cộng sản Hồ Chí Minh" width="28" height="30" />
        <img src="../assets/logo-bk.png" alt="Trường Đại học Bách khoa TP.HCM" width="30" height="30" />
        <img src="../assets/logo-Hoi.png" alt="Hội Sinh viên Việt Nam" width="30" height="30" />
        <img class="wordmark" src="../assets/logo-cse.png" alt="Khoa Khoa học và Kỹ thuật Máy tính" width="38" height="20" />
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="catalog">
      <div class="hero slim">
        <h1>Công cụ <em>PDF</em></h1>
        <input class="tool-search" id="tool-search" type="search" placeholder="Tìm công cụ…" />
      </div>
      <div id="tool-cats"></div>
    </section>

    <section class="panel active" id="workspace" hidden>
      <button class="ghost ws-back" id="ws-back" type="button">← Tất cả công cụ</button>
      <div class="panel-head">
        <h2 id="ws-title"></h2>
        <p id="ws-desc"></p>
      </div>
      <p class="hint" id="ws-note" hidden></p>
      <label class="drop" id="ws-drop">
        <input id="ws-input" type="file" multiple hidden />
        <span class="drop-icon"><svg class="i"><use href="#i-upload" /></svg></span>
        <span class="drop-title" id="ws-drop-title">Kéo thả file vào đây hoặc <u>bấm để chọn</u></span>
      </label>
      <div class="options" id="ws-options"></div>
      <div class="list" id="ws-list"></div>
      <div class="actions">
        <button class="ghost" id="ws-clear" type="button"><svg class="i"><use href="#i-trash-2" /></svg> Xóa hết</button>
        <button class="primary" id="ws-run" type="button" disabled>Chạy</button>
      </div>
      <div class="results" id="ws-results"></div>
    </section>
  </main>

  <div id="toast" hidden></div>

  <script src="../core.js"></script>
  <script src="../vendor/heic2any.min.js"></script>
  <script src="../vendor/pdf-lib.min.js"></script>
  <script src="../vendor/pdf.min.js"></script>
  <script src="../vendor/jszip.min.js"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
